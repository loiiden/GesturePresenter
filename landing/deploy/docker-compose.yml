# Runs on the VPS. The site container is built and pushed by the
# "Deploy landing site" GitHub Action. The site is fully self-contained: the app
# is installed from source with uv, so no installer files are hosted.
services:
  web:
    image: gp-site:latest
    container_name: gp-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: loiiden.de
      ACME_EMAIL: you@loiiden.de   # <-- set a real address for Let's Encrypt
    volumes:
      - caddy_data:/data       # persisted TLS certificates
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
