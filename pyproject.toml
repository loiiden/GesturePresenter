[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-presenter"
version = "0.1.0"
description = "Cross-platform gesture controller for presentations"
requires-python = ">=3.10,<3.13"
dependencies = [
  # Upper bound is deliberate. mediapipe 1.x aborts at landmarker creation on
  # macOS with "graph_service.h:139] Check failed: service_ Service is
  # unavailable" from DrishtiMetalHelper — a hard process abort, not a Python
  # exception, so it cannot be caught and retried at runtime.
  "mediapipe>=0.10.14,<1.0",
  "opencv-python>=4.9",
  "pyautogui>=0.9.54",
  "pyperclip>=1.8",
  "pywebview>=5.1",
  "screeninfo>=0.8.1",
  "pyobjc-framework-AVFoundation>=9.0; platform_system == 'Darwin'",
  "pyobjc-framework-ApplicationServices>=9.0; platform_system == 'Darwin'",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.0",
  "numpy>=1.26",
  "sounddevice>=0.4.7",
]
# Linux GUI backend for pywebview. macOS and Windows use the OS's built-in
# WebView, but on Linux pywebview needs GTK (system PyGObject + WebKitGTK, which
# a plain venv or uv-managed Python can't import) or Qt. Qt is fully pip-installable
# inside the environment, so it's the reliable choice for running from source.
gui-qt = ["qtpy>=2.4", "PyQt6>=6.6", "PyQt6-WebEngine>=6.6"]
# Development-only: recording datasets and training the gesture model. The
# shipped application reads the exported .npz with NumPy alone, so scikit-learn
# is never a runtime dependency and its pickle-compatibility caveats do not
# reach end users.
research = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.gui-scripts]
gesture-presenter = "app:main"

[tool.setuptools]
# research/ is intentionally absent: the recorder and trainer are development
# tools, not part of the installable application.
py-modules = ["app", "config", "devices", "permissions", "hand_tracker", "gestures",
              "gesture_features", "gesture_model", "simple_mode", "actions", "speech"]

[tool.setuptools.data-files]
"gesture_presenter" = [
  "hand_landmarker.task",
  "models/gesture_mlp.npz", "models/simple_pinch.npz",
  "frontend/index.html", "frontend/styles.css", "frontend/app.js",
]
